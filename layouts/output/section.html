{{ define "main" }}

<ul>

    <li><a href="{{ .RelPermalink }}">{{ .Title | path.Base }}</a></li>

  {{ range resources.Match "output/*.zip.aesgcm" }}

  {{ end }}
</ul>
{{ end }}
